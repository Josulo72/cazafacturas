<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cazafacturas</title>
<meta name="description" content="Extrae y comprueba facturas en local. Sin IA, sin red y sin claves.">
<link rel="stylesheet" href="/static/fuentes.css">
<link rel="stylesheet" href="/static/estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23EDE7D7'/><g stroke='%231B45C8' stroke-width='1.6' stroke-linecap='square' fill='none'><path d='M9 5.5V21'/><path d='M13 8.5h13M13 13h11M13 17.5h8'/><path d='M5 23.5h22M5 27h22'/></g></svg>">
</head>
<body>

<!-- Marcas de contable. Dibujadas, no glifos: mismo trazo en todas. -->
<svg class="sprite" aria-hidden="true">
  <!-- El filo del caucho nunca es limpio: el desplazamiento lo rompe. -->
  <filter id="tinta-corrida" x="-8%" y="-15%" width="116%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5" result="ruido"/>
    <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2.1"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>

  <!-- ============================================================== -->
  <!-- La tinta del sello.                                            -->
  <!-- Tres pasadas, en el mismo orden que ocurren en el papel:       -->
  <!--   1. el filo del caucho, que nunca imprime recto;              -->
  <!--   2. el reparto de la tinta, con zonas cargadas y zonas pobres;-->
  <!--   3. las calvas, donde el caucho estaba seco y no dejó nada.   -->
  <!-- Cada variante lleva otra semilla y otra carga: dos sellos       -->
  <!-- seguidos no pueden salir iguales, y el segundo sale más pobre  -->
  <!-- porque nadie ha vuelto al tampón.                              -->
  <!-- ============================================================== -->
  <filter id="sello-cargado" x="-14%" y="-22%" width="128%" height="144%"
          color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" result="filo"/>
    <feDisplacementMap in="SourceGraphic" in2="filo" scale="2.2"
                       xChannelSelector="R" yChannelSelector="G" result="marca"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="3" seed="21" result="reparto"/>
    <feComponentTransfer in="reparto" result="reparto_a">
      <feFuncA type="linear" slope="4.2" intercept="-0.18"/>
    </feComponentTransfer>
    <feComposite in="marca" in2="reparto_a" operator="in" result="paso1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.11 0.26" numOctaves="2" seed="47" result="seco"/>
    <feComponentTransfer in="seco" result="seco_a">
      <feFuncA type="discrete" tableValues="1 1 1 1 1 1 1 1 1 0.2 1 1 1 0.65 1 1 1 1"/>
    </feComponentTransfer>
    <feComposite in="paso1" in2="seco_a" operator="in"/>
  </filter>

  <!-- Segunda pasada sin volver a entintar: menos carga, más calvas. -->
  <filter id="sello-seco" x="-14%" y="-22%" width="128%" height="144%"
          color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="13" result="filo"/>
    <feDisplacementMap in="SourceGraphic" in2="filo" scale="2.6"
                       xChannelSelector="R" yChannelSelector="G" result="marca"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="34" result="reparto"/>
    <feComponentTransfer in="reparto" result="reparto_a">
      <feFuncA type="linear" slope="3.5" intercept="-0.28"/>
    </feComponentTransfer>
    <feComposite in="marca" in2="reparto_a" operator="in" result="paso1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.14 0.3" numOctaves="2" seed="61" result="seco"/>
    <feComponentTransfer in="seco" result="seco_a">
      <feFuncA type="discrete" tableValues="1 1 1 1 1 0.15 1 1 0.55 1 1 1 1 0.3 1 1"/>
    </feComponentTransfer>
    <feComposite in="paso1" in2="seco_a" operator="in"/>
  </filter>

  <symbol id="i-aspa" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-llamada" viewBox="0 0 16 16"><path d="M2.5 8.5l3.2 3.5L13.5 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-admiracion" viewBox="0 0 16 16"><path d="M8 2.5v7M8 13.2v.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-subir" viewBox="0 0 16 16"><path d="M8 12.5V3.5M4.5 7L8 3.5 11.5 7M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bajar" viewBox="0 0 16 16"><path d="M8 2.5v9M4.5 8L8 11.5 11.5 8M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-volver" viewBox="0 0 16 16"><path d="M13 8H3.5M7 3.5L2.5 8 7 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-papelera" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5v-2h3v2M4.2 4.5l.7 9h6.2l.7-9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="pliego">

  <header class="cabecera">
    <div class="membrete">
      <a class="lockup" href="/" aria-label="Cazafacturas">
        <svg class="anagrama" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="currentColor">
            <path d="M8.1 5.2h2.5v16.2H8.1z"/>
            <path d="M13.6 8.1h12.6v1.1H13.6zM13.6 12.7h10.4v1.1H13.6zM13.6 17.3h7.6v1.1h-7.6z"/>
            <path d="M5 23.2h22v1.9H5zM5 26.8h22v0.9H5z"/>
          </g>
        </svg>
        <h1 class="marca">Cazafacturas</h1>
      </a>
      <p class="lema" data-t="lema"></p>
    </div>

    <div class="ajustes">
      <label class="ajuste">
        <span class="ajuste-et" data-t="idioma"></span>
        <select id="sel-idioma" class="selector"></select>
      </label>
      <label class="ajuste">
        <span class="ajuste-et" data-t="pais"></span>
        <select id="sel-pais" class="selector"></select>
      </label>
      <button id="btn-tema" class="boton-tema" type="button" aria-pressed="false">
        <span class="tema-marca" aria-hidden="true"></span>
        <span id="btn-tema-texto" data-t="tema_oscuro"></span>
      </button>
    </div>
  </header>

  <nav class="unheros" aria-label="Secciones">
    <button class="unhero activo" type="button" data-vista="revisar" data-t="revisar" aria-current="page"></button>
    <button class="unhero" type="button" data-vista="banco" data-t="banco"></button>
    <button class="unhero" type="button" data-vista="historial" data-t="historial"></button>
  </nav>

  <main class="hoja">

    <!-- ============================ REVISAR ============================ -->
    <section class="vista activa" id="v-revisar">
      <div class="encabezado">
        <div>
          <h2 class="titulo" data-t="revisar_titulo"></h2>
          <p class="subtitulo" data-t="revisar_sub"></p>
        </div>
        <div class="acciones">
          <button id="btn-exportar" class="boton" type="button" hidden>
            <svg class="icono" aria-hidden="true"><use href="#i-bajar"/></svg>
            <span data-t="exportar"></span>
          </button>
          <button id="btn-vaciar" class="boton boton-tenue" type="button" hidden>
            <svg class="icono" aria-hidden="true"><use href="#i-papelera"/></svg>
            <span data-t="vaciar"></span>
          </button>
        </div>
      </div>

      <p class="aviso-sistema" id="aviso-ocr" hidden>
        <svg class="icono" aria-hidden="true"><use href="#i-admiracion"/></svg>
        <span><span data-t="sin_ocr"></span> <code>pip install "cazafacturas[ocr]"</code></span>
      </p>

      <p class="aviso-sistema aviso-error" id="aviso-error" hidden role="alert"></p>

      <!-- El pliego en blanco: cabeceras ya dibujadas, esperando el asiento -->
      <div class="zona" id="zona" tabindex="0" role="button" aria-describedby="zona-detalle">
        <span class="recuadro" aria-hidden="true"></span>
        <div class="zona-interior">
          <svg class="icono icono-grande" aria-hidden="true"><use href="#i-subir"/></svg>
          <p class="zona-titulo" data-t="soltar_aqui"></p>
          <p class="zona-detalle" id="zona-detalle" data-t="soltar_detalle"></p>
          <p class="anotacion" data-t="anotacion_local"></p>
          <div class="zona-botones">
            <button id="btn-elegir" class="boton" type="button" data-t="elegir_ficheros"></button>
            <button id="btn-muestras" class="boton boton-tenue" type="button" data-t="probar_muestras"></button>
          </div>
        </div>
        <input type="file" id="entrada-fichero" multiple accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp" hidden>
      </div>

      <div class="progreso" id="progreso" hidden>
        <div class="progreso-riel"><div class="progreso-pluma" id="progreso-pluma"></div></div>
        <p class="progreso-texto" id="progreso-texto"></p>
      </div>

      <div class="libro-envoltura" id="libro-envoltura" hidden>
        <table class="libro">
          <caption class="oculto-visual" data-t="revisar_titulo"></caption>
          <thead>
            <tr>
              <th class="c-folio" scope="col" data-t="col_folio"></th>
              <th scope="col" data-t="col_documento"></th>
              <th scope="col" data-t="col_numero"></th>
              <th scope="col" data-t="col_fecha"></th>
              <th scope="col" data-t="col_emisor"></th>
              <th class="c-cifra" scope="col" data-t="col_base"></th>
              <th class="c-cifra" scope="col" data-t="col_impuesto"></th>
              <th class="c-cifra" scope="col" data-t="col_total"></th>
              <th class="c-estado" scope="col" data-t="col_estado"></th>
            </tr>
          </thead>
          <tbody id="libro-cuerpo"></tbody>
          <tfoot id="libro-pie"></tfoot>
        </table>
      </div>

      <div class="vacio" id="vacio-libro" hidden>
        <p class="vacio-titulo" data-t="vacio_libro"></p>
        <p class="vacio-sub" data-t="vacio_libro_sub"></p>
      </div>
    </section>

    <!-- ============================ DETALLE ============================ -->
    <section class="vista" id="v-detalle">
      <button id="btn-volver" class="boton boton-tenue boton-volver" type="button">
        <svg class="icono" aria-hidden="true"><use href="#i-volver"/></svg>
        <span data-t="volver"></span>
      </button>
      <div id="detalle-cuerpo"></div>
    </section>

    <!-- ============================= BANCO ============================= -->
    <section class="vista" id="v-banco">
      <div class="encabezado">
        <div>
          <h2 class="titulo" data-t="banco_titulo"></h2>
          <p class="subtitulo" data-t="banco_sub"></p>
        </div>
        <div class="acciones">
          <label class="casilla">
            <input type="checkbox" id="chk-trampas" checked>
            <span class="casilla-marca" aria-hidden="true"></span>
            <span data-t="banco_incluir"></span>
          </label>
          <button id="btn-banco" class="boton" type="button" data-t="banco_lanzar"></button>
        </div>
      </div>

      <div class="progreso" id="progreso-banco" hidden>
        <div class="progreso-riel"><div class="progreso-pluma" id="progreso-banco-pluma"></div></div>
        <p class="progreso-texto" id="progreso-banco-texto"></p>
      </div>

      <p class="glosa" data-t="banco_explica"></p>
      <div id="banco-cuerpo"></div>
    </section>

    <!-- =========================== HISTORIAL =========================== -->
    <section class="vista" id="v-historial">
      <div class="encabezado">
        <div>
          <h2 class="titulo" data-t="historial_titulo"></h2>
          <p class="subtitulo" data-t="historial_sub"></p>
        </div>
      </div>
      <div id="historial-cuerpo"></div>
    </section>

  </main>

  <footer class="colofon">
    <span>Cazafacturas <span id="pie-version"></span></span>
    <span class="colofon-sep" aria-hidden="true"></span>
    <span id="pie-capacidades"></span>
    <span class="colofon-firma">
      <span data-t="hecho_por"></span>
      <a href="https://latidosia.com" rel="noreferrer noopener" target="_blank">LatidosIA.com</a>
    </span>
  </footer>

</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
