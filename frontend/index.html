<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cazafacturas — Banco de evaluación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <span class="nav-logo">cf</span>
        <span class="nav-title">Cazafacturas</span>
      </div>
      <div class="nav-links">
        <button class="nav-link activa" data-pantalla="panel" data-i18n="panel"></button>
        <button class="nav-link" data-pantalla="ejecucion" data-i18n="ejecucion"></button>
        <button class="nav-link" data-pantalla="dataset" data-i18n="dataset"></button>
      </div>
      <div class="nav-selectores">
        <div class="selector-idioma">
          <label for="select-idioma" data-i18n="idioma"></label>
          <select id="select-idioma">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="selector-pais">
          <label for="select-pais" data-i18n="pais"></label>
          <select id="select-pais"></select>
        </div>
      </div>
      <button class="nav-tema" id="btn-tema" title="Cambiar tema">
        <svg class="icono-tema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- PANEL -->
  <section class="pantalla pantalla-panel activa" id="pantalla-panel">
    <header class="encabezado-panel">
      <div class="encabezado-texto">
        <h1 data-i18n="panel"></h1>
        <p class="encabezado-sub" data-i18n="subtitulo"></p>
      </div>
      <div class="controles-ejecucion">
        <div class="selector-motor">
          <label for="select-motor" data-i18n="motor"></label>
          <select id="select-motor"></select>
        </div>
        <label class="check-trampas">
          <input type="checkbox" id="check-trampas">
          <span class="check-marca"></span>
          <span data-i18n="incluir_trampas"></span>
        </label>
        <button class="btn-ejecutar" id="btn-ejecutar">
          <span class="btn-texto" data-i18n="ejecutar_lote"></span>
          <svg class="btn-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
      </div>
    </header>

    <div class="barra-progreso" id="seccion-progreso" hidden>
      <div class="barra-track">
        <div id="barra-relleno" class="barra-fill"></div>
      </div>
      <p id="texto-progreso" class="barra-texto"></p>
    </div>

    <div class="chips-motores" id="seccion-motores" hidden></div>

    <section class="seccion-metricas">
      <div class="vacio-grande" id="contenedor-comparativa">
        <div class="vacio-icono">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="6" y="10" width="36" height="28" rx="2"/>
            <line x1="6" y1="18" x2="42" y2="18"/>
            <line x1="18" y1="10" x2="18" y2="38"/>
          </svg>
        </div>
        <p data-i18n="sin_ejecuciones"></p>
        <p class="vacio-sub" data-i18n="lanza_primero"></p>
      </div>

      <div class="tabla-envolvente" id="contenedor-tabla" hidden>
        <table class="tabla-metricas">
          <thead>
            <tr>
              <th data-i18n="motor"></th>
              <th>Modelo</th>
              <th class="th-numero" data-i18n="precision"></th>
              <th class="th-numero th-invencion" data-i18n="invencion"></th>
              <th class="th-numero" data-i18n="aciertos"></th>
              <th class="th-numero" data-i18n="fallos"></th>
              <th class="th-numero" data-i18n="inventados"></th>
              <th class="th-numero" data-i18n="tiempo"></th>
              <th class="th-numero" data-i18n="casos"></th>
            </tr>
          </thead>
          <tbody id="cuerpo-comparativa"></tbody>
        </table>
      </div>
    </section>

    <section class="seccion-invenciones">
      <h2 data-i18n="campos_mas_inventados"></h2>
      <div id="contenedor-invenciones" class="invenciones-vacio">
        <p data-i18n="sin_invenciones"></p>
      </div>
    </section>
  </section>

  <!-- EJECUCIÓN EN VIVO -->
  <section class="pantalla pantalla-ejecucion" id="pantalla-ejecucion">
    <header class="encabezado-ejecucion">
      <div>
        <h1 data-i18n="ejecucion_en_vivo"></h1>
        <p class="encabezado-sub" id="ejecucion-subtitle"></p>
      </div>
      <div class="ejecucion-meta" id="ejecucion-meta" hidden>
        <div class="meta-item">
          <span class="meta-label" data-i18n="progreso"></span>
          <span class="meta-valor" id="meta-progreso">0/0</span>
        </div>
        <div class="meta-item">
          <span class="meta-label" data-i18n="aciertos"></span>
          <span class="meta-valor meta-acierto" id="meta-aciertos">0</span>
        </div>
        <div class="meta-item">
          <span class="meta-label" data-i18n="fallos"></span>
          <span class="meta-valor meta-fallo" id="meta-fallos">0</span>
        </div>
        <div class="meta-item">
          <span class="meta-label" data-i18n="inventados"></span>
          <span class="meta-valor meta-invencion" id="meta-invenciones">0</span>
        </div>
      </div>
    </header>

    <div class="nodos-vacia" id="nodos-vacia">
      <div class="vacio-icono">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="24" cy="24" r="18"/>
          <polyline points="24 14 24 24 32 28"/>
        </svg>
      </div>
      <p data-i18n="sin_ejecucion"></p>
      <p class="vacio-sub" data-i18n="nodos_esperan"></p>
    </div>

    <div class="nodos-grid" id="nodos-grid" hidden></div>
  </section>

  <!-- DETALLE DE CASO -->
  <section class="pantalla pantalla-detalle" id="pantalla-detalle">
    <header class="encabezado-detalle">
      <button class="btn-volver" id="btn-volver-ejecucion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span data-i18n="volver"></span>
      </button>
      <div>
        <h1 id="detalle-titulo">Detalle de caso</h1>
        <p class="encabezado-sub" id="detalle-sub"></p>
      </div>
    </header>

    <div class="detalle-layout">
      <div class="detalle-documento">
        <h3 data-i18n="documento_original"></h3>
        <pre class="bloque-json" id="detalle-documento"></pre>
      </div>

      <div class="detalle-comparacion">
        <div class="detalle-columna detalle-esperado">
          <h3 data-i18n="respuesta_esperada"></h3>
          <pre class="bloque-json" id="detalle-esperado"></pre>
        </div>
        <div class="detalle-columna detalle-obtenido">
          <h3 data-i18n="respuesta_obtenida"></h3>
          <pre class="bloque-json" id="detalle-obtenido"></pre>
        </div>
      </div>

      <div class="detalle-campos">
        <h3 data-i18n="resultado_por_campo"></h3>
        <div class="campos-lista" id="detalle-campos"></div>
      </div>
    </div>
  </section>

  <!-- DATASET -->
  <section class="pantalla pantalla-dataset" id="pantalla-dataset">
    <header class="encabezado-dataset">
      <div>
        <h1 data-i18n="dataset_titulo"></h1>
        <p class="encabezado-sub" data-i18n="dataset_sub"></p>
      </div>
    </header>

    <div class="dataset-filtros">
      <button class="dataset-filtro activo" data-filtro="todos" data-i18n="filtro_todos"></button>
      <button class="dataset-filtro" data-filtro="normales" data-i18n="filtro_normales"></button>
      <button class="dataset-filtro" data-filtro="trampas" data-i18n="filtro_trampas"></button>
    </div>

    <div class="dataset-grid" id="dataset-grid"></div>
  </section>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
